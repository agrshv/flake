# `statix check` in CI (.github/workflows/check.yml).
# repeated_keys: modules group settings per service (services.sonarr = …,
# services.radarr = …, networking.nat = …) on purpose; folding them into one
# attrset would separate each setting from the comment that explains it.
disabled = [ "repeated_keys" ]
# Generated by nixos-generate-config and regenerated on reinstall.
ignore = [ "hosts/*/hardware-configuration.nix" ]
