# Keeps the SHA-pinned actions (and their `# vX.Y.Z` comments) current. One
# grouped PR a week. flake.lock is updated by .github/workflows/update-flake-lock.yml.
# The composite action under .github/actions is listed too, so actions it
# might use later are covered.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Almaty
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
