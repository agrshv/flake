# Formatting and evaluation of every host on each push. Evaluation only
# (--no-build) for the hosts; on master, umbriel and its portal (which have no
# upstream binary cache) are then built and pushed to agrshv.cachix.org so the
# laptop substitutes them instead of compiling after every lock update. Only
# those two are pushed: the cache is public, and a full system build would
# drag in config generated from the private `work` input.
#
# The `work` and `jobscout` inputs are private repos fetched over SSH. Each
# gets its own read-only deploy key (GitHub scopes a deploy key to one repo):
# the public half under that repo's Settings → Deploy keys, the private half
# as WORK_DEPLOY_KEY / JOBSCOUT_DEPLOY_KEY here. Nix fetches with the git CLI,
# so an insteadOf rule per input sends it through an SSH host alias that
# offers only that repo's key.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Deploy keys for the private inputs
        env:
          WORK_DEPLOY_KEY: ${{ secrets.WORK_DEPLOY_KEY }}
          JOBSCOUT_DEPLOY_KEY: ${{ secrets.JOBSCOUT_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          # GitHub's published host keys rather than trusting ssh-keyscan.
          curl -fsS https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          for repo in flake-work jobscout; do
            case $repo in
              flake-work) key=$WORK_DEPLOY_KEY ;;
              jobscout) key=$JOBSCOUT_DEPLOY_KEY ;;
            esac
            if [ -z "$key" ]; then
              echo "::error::no deploy key secret for agrshv/$repo"
              exit 1
            fi
            (umask 077 && printf '%s\n' "$key" > ~/.ssh/$repo)
            printf 'Host github-%s\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/%s\n  IdentitiesOnly yes\n' \
              "$repo" "$repo" >> ~/.ssh/config
            git config --global \
              url."ssh://git@github-$repo/agrshv/$repo".insteadOf \
              "ssh://git@github.com/agrshv/$repo"
          done
      - run: nix fmt -- --ci
      - run: nix flake check --no-build --all-systems
      - uses: cachix/cachix-action@v16
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: agrshv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push explicitly below instead of everything the job built.
          skipPush: true
      - name: Build and cache umbriel
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          # The laptop's own derivations (built against our nixpkgs-unstable),
          # not the umbriel flake's packages, so the hashes match.
          cfg=.#nixosConfigurations.work-laptop.config.programs.umbriel
          nix build --no-link --print-out-paths "$cfg.package" "$cfg.portalPackage" \
            | cachix push agrshv
