# Formatting and evaluation of every host on each push. Evaluation only
# (--no-build) for the hosts; on master, umbriel and its portal (which have no
# upstream binary cache) are then built and pushed to agrshv.cachix.org so the
# laptop substitutes them instead of compiling after every lock update. Only
# those two are pushed: the cache is public, and a full system build would
# drag in config generated from the private `work` input.
#
# The private `work` and `jobscout` inputs are reached through
# .github/actions/private-inputs.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: ./.github/actions/private-inputs
        with:
          work-deploy-key: ${{ secrets.WORK_DEPLOY_KEY }}
          jobscout-deploy-key: ${{ secrets.JOBSCOUT_DEPLOY_KEY }}
      # Formatting and lints (nixfmt, deadnix, statix, stylua, actionlint,
      # yamlfmt; see treefmt.nix).
      - run: nix fmt -- --ci
      - run: nix flake check --no-build --all-systems
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: agrshv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push explicitly below instead of everything the job built.
          skipPush: true
      - name: Build and cache umbriel
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          # The laptop's own derivations (built against our nixpkgs-unstable),
          # not the umbriel flake's packages, so the hashes match.
          cfg=.#nixosConfigurations.work-laptop.config.programs.umbriel
          nix build --no-link --print-out-paths "$cfg.package" "$cfg.portalPackage" \
            | cachix push agrshv
